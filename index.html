<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/x-icon" href="/iconfin.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/iconfin.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/iconfin.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/iconfin.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/iconfin.ico" />

    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#1a365d" />
    <meta name="msapplication-TileColor" content="#1a365d" />

    <!-- ❗ No SEO tags here on purpose.
         Title, description, OG, Twitter, JSON-LD, canonical, etc.
         are all injected by React via SEO.jsx + react-helmet-async. -->

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- FinReach dashboard styles -->
    <link rel="stylesheet" type="text/css" href="./src/Dashboard/Dashboard.css" />
  </head>

  <body>
    <!-- Root div for React app -->
    <div id="root"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- React App -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
